<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AccountSearch AI</title>
<style>
  :root {
    --bg: #131318; --panel: #1e1e26; --panel2: #26262f; --border: #33333e;
    --text: #e8e8ee; --muted: #9a9aa8; --accent: #cc7a5c; --user-bubble: #2d3a52;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 140px; }
  header { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 14px; flex-wrap: wrap; }
  header h1 { font-size: 22px; font-weight: 700; }
  header .badge { color: var(--muted); font-size: 13px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tabs button {
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 8px 18px; font-size: 14px; cursor: pointer;
  }
  .tabs button.active { color: #fff; border-color: var(--accent); background: var(--panel2); }
  .view { display: none; }
  .view.active { display: block; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chips button {
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  .chips button:hover { color: var(--text); border-color: var(--accent); }
  .msg { display: flex; gap: 12px; margin-bottom: 18px; }
  .msg .avatar {
    flex: 0 0 32px; height: 32px; border-radius: 8px; display: flex; align-items: center;
    justify-content: center; font-size: 16px; background: var(--panel2);
  }
  .msg.user .avatar { background: var(--user-bubble); }
  .msg .body { flex: 1; min-width: 0; }
  .msg.user .body { background: var(--user-bubble); border-radius: 12px; padding: 10px 14px; }
  .msg .content p { margin-bottom: 8px; }
  .msg .content ul { margin: 0 0 8px 22px; }
  .msg .content strong { color: #fff; }
  .msg .content code { background: var(--panel2); border-radius: 4px; padding: 1px 5px; font-size: 14px; }
  details.sql { margin-top: 10px; font-size: 13px; }
  details.sql summary { cursor: pointer; color: var(--muted); }
  details.sql pre {
    background: var(--pan2, var(--panel2)); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; margin-top: 6px; overflow-x: auto; white-space: pre-wrap; font-size: 12.5px;
  }
  details.sql .reason { color: var(--muted); margin-top: 5px; }
  .tablebox { margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: auto; max-height: 340px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel2); }
  .dl { margin-top: 8px; display: inline-block; font-size: 13px; color: var(--accent); cursor: pointer; background: none; border: none; padding: 0; }
  .error { color: #e5817a; background: rgba(229,129,122,.08); border: 1px solid rgba(229,129,122,.3); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .thinking { color: var(--muted); font-style: italic; }
  .thinking .dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0% {content:""} 25% {content:"."} 50% {content:".."} 75% {content:"..."} }

  /* ---- AI chat input bar (fixed bottom) ---- */
  form.inputbar {
    position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, var(--bg) 30%);
    padding: 26px 16px 22px;
  }
  form.inputbar .inner {
    max-width: 820px; margin: 0 auto; display: flex; gap: 10px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px;
  }
  form.inputbar .inner:focus-within { border-color: var(--accent); }
  form.inputbar input {
    flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 15.5px;
  }
  form.inputbar button {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 8px 16px; font-size: 15px; cursor: pointer;
  }
  form.inputbar button:disabled { opacity: .45; cursor: default; }
  .note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }

  /* ---- Quick search ---- */
  .qbar {
    display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 12px; position: relative; margin-bottom: 6px;
  }
  .qbar:focus-within { border-color: var(--accent); }
  .inputwrap { flex: 1; position: relative; display: flex; }
  .inputwrap input {
    flex: 1; background: transparent; border: none; outline: none; color: var(--text);
    font-size: 15.5px; padding: 0; position: relative; z-index: 1;
  }
  #ghost {
    position: absolute; inset: 0; display: flex; align-items: center; pointer-events: none;
    font-size: 15.5px; white-space: pre; overflow: hidden;
  }
  #ghost .typed { visibility: hidden; }
  #ghost .rest { color: var(--muted); opacity: .55; }
  #sugbox {
    position: absolute; top: calc(100% + 8px); left: 0; right: 0; display: none;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; z-index: 6; box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  #sugbox button {
    display: block; width: 100%; text-align: left; padding: 9px 14px; background: none;
    border: none; border-radius: 0; color: var(--text); font-size: 14px; cursor: pointer;
  }
  #sugbox button .hint { color: var(--muted); font-size: 12px; margin-left: 8px; }
  #sugbox button.active, #sugbox button:hover { background: var(--panel2); }
  .qhint { color: var(--muted); font-size: 12.5px; margin: 4px 2px 12px; }
  #qcount { font-size: 14px; margin: 10px 2px; color: var(--muted); }
  #qcount strong { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔎 AccountSearch AI</h1>
    <span class="badge">500,000 accounts</span>
  </header>

  <div class="tabs">
    <button id="tab-quick" class="active" type="button">⚡ Quick Search</button>
    <button id="tab-chat" type="button">🤖 AI Chat</button>
  </div>

  <!-- ================= Quick Search view ================= -->
  <div id="view-quick" class="view active">
    <div class="qbar">
      <div id="sugbox"></div>
      <div class="inputwrap">
        <div id="ghost"><span class="typed"></span><span class="rest"></span></div>
        <input id="qinput" placeholder="Type an account name… (typos ok)" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="qhint">Instant, typo-tolerant matching over all account records — nothing sent to AI. Tab accepts the inline suggestion.</div>
    <div id="qcount"></div>
    <div id="qresults"></div>
  </div>

  <!-- ================= AI Chat view ================= -->
  <div id="view-chat" class="view">
    <div class="chips" id="chips"></div>
    <div id="chat"></div>
  </div>
</div>

<form class="inputbar" id="form" style="display:none">
  <div class="inner">
    <input id="input" placeholder="Ask the AI about accounts…" autocomplete="off">
    <button id="send" type="submit">Send</button>
  </div>
  <div class="note">AI understands full questions: filters, counts, comparisons, patterns. Answers come only from the 500,000-row dataset.</div>
</form>

<script>
const EXAMPLES = [
  "how many accounts have 'LLC' in the name?",
  "accounts with account id over 400000",
  "show me the accounts starting with \"A\"",
  "compare how many names end in Inc vs LLC",
  "what patterns do you see in bank-related names?",
];
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const history = [];
let busy = false;

// ---------------- tabs ----------------
const views = {
  quick: [document.getElementById("view-quick"), document.getElementById("tab-quick")],
  chat: [document.getElementById("view-chat"), document.getElementById("tab-chat")],
};
function showTab(which) {
  for (const [name, [view, tab]] of Object.entries(views)) {
    view.classList.toggle("active", name === which);
    tab.classList.toggle("active", name === which);
  }
  form.style.display = which === "chat" ? "" : "none";
  (which === "chat" ? input : document.getElementById("qinput")).focus();
}
views.quick[1].onclick = () => showTab("quick");
views.chat[1].onclick = () => showTab("chat");

// ---------------- shared helpers ----------------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function buildTable(columns, rows) {
  const box = el("div", "tablebox");
  const t = el("table");
  const thead = el("thead"); const hr = el("tr");
  columns.forEach(c => hr.appendChild(el("th", "", c)));
  thead.appendChild(hr); t.appendChild(thead);
  const tb = el("tbody");
  rows.forEach(r => {
    const tr = el("tr");
    r.forEach(v => tr.appendChild(el("td", "", String(v))));
    tb.appendChild(tr);
  });
  t.appendChild(tb); box.appendChild(t);
  return box;
}

function csvButton(columns, rows, fname) {
  const dl = el("button", "dl", "⬇️ Download CSV");
  dl.type = "button";
  dl.onclick = () => {
    const esc = v => `"${String(v).replaceAll('"','""')}"`;
    const csv = [columns.map(esc).join(",")].concat(rows.map(r => r.map(esc).join(","))).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
    a.download = fname;
    a.click();
  };
  return dl;
}

// ---------------- dataset (client-side copy for quick search) ----------------
let NAMES = [];  // [{id, accountId, name, lower, words, skels}]
const skel = s => s.replace(/[aeiou]+/g, "");
fetch("Accounts-VadlamudiRamesh.csv").then(r => r.text()).then(t => {
  NAMES = t.split(/\r?\n/).map((line, idx) => {
    const m = line.replace(/^﻿/, "").match(/^(\d+),(?:"(.*)"|(.*))$/);
    if (!m) return null;
    const name = m[2] || m[3];
    if (!name) return null;
    const lower = name.toLowerCase();
    const words = lower.replace(/[^a-z0-9 ]+/g, " ").split(/\s+/).filter(Boolean);
    return {id: idx + 1, accountId: m[1], name, lower, words, skels: words.map(skel)};
  }).filter(Boolean);
  runQuick();  // render initial state once data is ready
}).catch(() => {});

// ---------------- Quick Search ----------------
const qinput = document.getElementById("qinput");
const qcount = document.getElementById("qcount");
const qresults = document.getElementById("qresults");
const ghostTyped = document.querySelector("#ghost .typed");
const ghostRest = document.querySelector("#ghost .rest");
const sugbox = document.getElementById("sugbox");
let sugs = [], activeSug = -1;

function tokenMatches(entry, tok) {
  if (entry.lower.includes(tok)) return 1;                    // substring
  const ts = skel(tok);
  for (let i = 0; i < entry.words.length; i++) {              // typo: consonant skeleton
    if (entry.skels[i] === ts && entry.words[i][0] === tok[0]) return 2;
  }
  return 0;
}

function quickMatch(q) {
  const ql = q.toLowerCase().trim();
  const toks = ql.replace(/[^a-z0-9 ]+/g, " ").split(/\s+/).filter(t => t.length > 1);
  if (!toks.length) return {matches: [], corrected: false};
  const matches = []; let anyCorrected = false;
  for (const entry of NAMES) {
    let ok = true, corrected = false;
    for (const tok of toks) {
      const m = tokenMatches(entry, tok);
      if (!m) { ok = false; break; }
      if (m === 2) corrected = true;
    }
    if (!ok) continue;
    anyCorrected = anyCorrected || corrected;
    matches.push({entry, corrected, prefix: entry.lower.startsWith(ql)});
  }
  matches.sort((a, b) => (b.prefix - a.prefix) || (a.corrected - b.corrected) || (a.entry.name.length - b.entry.name.length));
  return {matches, corrected: anyCorrected};
}

function clearSuggest() {
  ghostTyped.textContent = ""; ghostRest.textContent = "";
  sugbox.style.display = "none"; sugbox.replaceChildren();
  sugs = []; activeSug = -1;
}

function runQuick() {
  clearSuggest();
  qcount.replaceChildren(); qresults.replaceChildren();
  const q = qinput.value;
  if (q.trim().length < 2) {
    qcount.textContent = NAMES.length ? `${NAMES.length.toLocaleString()} accounts loaded — start typing to search.` : "Loading accounts…";
    return;
  }
  const {matches} = quickMatch(q);
  if (!matches.length) {
    qcount.textContent = "No matching accounts. Try fewer or different words.";
    return;
  }
  // ghost completion + suggestions
  const best = matches.find(s => s.prefix);
  if (best && !/\s$/.test(q)) {
    ghostTyped.textContent = q;
    ghostRest.textContent = best.entry.name.slice(q.length);
  }
  sugs = matches.slice(0, 6);
  sugs.forEach(s => {
    const b = el("button", "", s.entry.name);
    b.type = "button";
    if (s.corrected) b.appendChild(el("span", "hint", "auto-corrected"));
    b.onclick = () => { qinput.value = s.entry.name; runQuick(); qinput.focus(); };
    sugbox.appendChild(b);
  });
  sugbox.style.display = "block";

  const countEl = el("div");
  countEl.appendChild(el("strong", "", matches.length.toLocaleString()));
  countEl.appendChild(document.createTextNode(` matching account${matches.length !== 1 ? "s" : ""}${matches.length > 100 ? " — showing the first 100" : ""}`));
  qcount.replaceChildren(countEl);

  const rows = matches.slice(0, 100).map(m => [m.entry.id, m.entry.accountId, m.entry.name]);
  qresults.appendChild(buildTable(["id", "account_id", "account_name"], rows));
  const allRows = matches.map(m => [m.entry.id, m.entry.accountId, m.entry.name]);
  qresults.appendChild(csvButton(["id", "account_id", "account_name"], allRows, "quicksearch_results.csv"));
}

function highlightSug() {
  [...sugbox.children].forEach((b, i) => b.classList.toggle("active", i === activeSug));
}

qinput.addEventListener("input", runQuick);
qinput.addEventListener("keydown", (e) => {
  if (e.key === "Tab" && ghostRest.textContent) {
    e.preventDefault();
    qinput.value = qinput.value + ghostRest.textContent;
    runQuick();
  } else if (e.key === "ArrowDown" && sugs.length) {
    e.preventDefault(); activeSug = (activeSug + 1) % sugs.length; highlightSug();
  } else if (e.key === "ArrowUp" && sugs.length) {
    e.preventDefault(); activeSug = (activeSug - 1 + sugs.length) % sugs.length; highlightSug();
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (activeSug >= 0) { qinput.value = sugs[activeSug].entry.name; runQuick(); }
    else clearSuggestOnlyDropdown();
  } else if (e.key === "Escape") {
    clearSuggestOnlyDropdown();
  }
});
function clearSuggestOnlyDropdown() {
  sugbox.style.display = "none"; sugbox.replaceChildren(); sugs = []; activeSug = -1;
  ghostTyped.textContent = ""; ghostRest.textContent = "";
}
document.addEventListener("click", (e) => {
  if (!sugbox.contains(e.target) && e.target !== qinput) clearSuggestOnlyDropdown();
});

// ---------------- AI Chat ----------------
const chipsEl = document.getElementById("chips");
EXAMPLES.forEach(q => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = q;
  b.onclick = () => { if (!busy) { input.value = q; form.requestSubmit(); } };
  chipsEl.appendChild(b);
});

function addMsg(role) {
  const m = el("div", "msg " + role);
  const av = el("div", "avatar", role === "user" ? "🙂" : "✳️");
  const body = el("div", "body");
  m.append(av, body);
  chat.appendChild(m);
  m.scrollIntoView({behavior: "smooth", block: "end"});
  return body;
}

// minimal safe markdown: bold, code, bullets, paragraphs
function renderMarkdown(target, text) {
  target.replaceChildren();
  const content = el("div", "content");
  for (const block of text.split(/\n{2,}/)) {
    const lines = block.split("\n");
    const isList = lines.every(l => /^\s*[-*•]\s+/.test(l) || !l.trim());
    const container = isList ? el("ul") : el("p");
    (isList ? lines.filter(l => l.trim()) : [block]).forEach(line => {
      const target2 = isList ? el("li") : container;
      const cleaned = isList ? line.replace(/^\s*[-*•]\s+/, "") : line;
      cleaned.split(/(\*\*[^*]+\*\*|`[^`]+`)/g).forEach(part => {
        if (/^\*\*[^*]+\*\*$/.test(part)) target2.appendChild(el("strong", "", part.slice(2, -2)));
        else if (/^`[^`]+`$/.test(part)) target2.appendChild(el("code", "", part.slice(1, -1)));
        else target2.appendChild(document.createTextNode(part));
      });
      if (isList) container.appendChild(target2);
    });
    content.appendChild(container);
  }
  target.appendChild(content);
}

function addResults(body, data) {
  if (data.sql) {
    const d = el("details", "sql");
    const s = el("summary", "", "🔍 How I searched");
    const pre = el("pre", "", data.sql);
    d.append(s, pre);
    if (data.reason) d.appendChild(el("div", "reason", data.reason));
    body.appendChild(d);
  }
  if (data.rows && data.rows.length) {
    body.appendChild(buildTable(data.columns, data.rows));
    body.appendChild(csvButton(data.columns, data.rows, "accountsearch_results.csv"));
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || busy) return;
  busy = true; send.disabled = true; input.value = "";

  renderMarkdown(addMsg("user"), q);
  history.push({role: "user", content: q});

  const body = addMsg("assistant");
  const think = el("div", "thinking");
  think.append("Asking the AI (can take up to a minute)", el("span", "dots"));
  body.appendChild(think);

  try {
    const resp = await fetch("/api/search", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query: q, history: history.slice(0, -1), mode: "ai"}),
    });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || `HTTP ${resp.status}`);
    renderMarkdown(body, data.answer);
    addResults(body, data);
    history.push({role: "assistant", content: data.answer});
  } catch (err) {
    body.replaceChildren(el("div", "error", "⚠️ " + err.message));
    history.pop(); // don't poison the context with a failed turn
  } finally {
    busy = false; send.disabled = false;
    body.scrollIntoView({behavior: "smooth", block: "end"});
  }
});

showTab("quick");
</script>
</body>
</html>
